name: Bug report
description: Report a reproducible, non-sensitive Flowmo problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This report may be public. Reproduce with synthetic text. Do not include intentions, parked thoughts, reflection text, account details, store paths, or full exports. Review screenshots and redacted diagnostics before attaching them.

        For a vulnerability or sensitive privacy concern, follow SECURITY.md instead of this form. If you do not have repository access, contact the person who supplied your build through your existing private channel.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or build
      description: Use flowmo --version for the terminal, or the app's diagnostic report. Include a commit SHA for source builds.
      placeholder: "Version and build, or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS
      placeholder: "Mac model and macOS version, or iPhone model and iOS version"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Mac window
        - Mac Focus scene or Mini
        - Mac menu bar or Focus Guard
        - CLI or live terminal view
        - Flowmo Local iPhone app
        - Focus Live Activity
        - Entitled iPhone app or Home Screen widget
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation route
      options:
        - Mac archive
        - Terminal archive and installer
        - Swift source build
        - Xcode Personal Team on iPhone
        - iPhone Simulator
        - Other or unsure
    validations:
      required: true
  - type: input
    id: issue-code
    attributes:
      label: Flowmo issue code
      description: Add the code shown by the app, if any. Do not paste private session text.
      placeholder: "FLOWMO-…"
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostic report
      description: Optional. Review the app's redacted diagnostic export before attaching it. Never attach the full-data export or unredacted logs here.
